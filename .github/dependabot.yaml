version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
    schedule:
      interval: daily
  - package-ecosystem: cargo
    allow:
      - dependency-type: all
    directory: /
    groups:
      cranelift:
        patterns:
          - cranelift*
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
